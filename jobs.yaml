      limit: 10

  - name: "Example Price Drop"
    type: "price_drop"
    schedule: "*/30 * * * *" # Every 30 minutes
    enabled: false
    params:
      url: "https://example.com/product"
      css_selector: ".price"
      target_price: 100.0

